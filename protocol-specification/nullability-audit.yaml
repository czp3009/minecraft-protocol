evidence_groups:
  - name: resource-pack-optionals
    ids:
      - "com/hiczp/minecraft/protocol/model/packet/ConfigurationPackets.kt#ConfigurationRemoveResourcePackPacket.uuid"
      - "com/hiczp/minecraft/protocol/model/packet/ConfigurationPackets.kt#ConfigurationAddResourcePackPacket.promptMessage"
      - "com/hiczp/minecraft/protocol/model/packet/PlayClientboundPlayerAndWorldPackets.kt#PlayRemoveResourcePackPacket.id"
      - "com/hiczp/minecraft/protocol/model/packet/PlayClientboundPlayerAndWorldPackets.kt#PlayAddResourcePackPacket.prompt"
    kotlin: nullable
    verdict: confirmed
    sources:
      wiki:
        status: confirmed
        evidence: >-
          packets.wikitext Remove/Add Resource Pack tables at lines 912-943
          declare the UUID and prompt as Prefixed Optional; the same common
          packet layouts are used in configuration and play.
      official:
        status: confirmed
        evidence: >-
          exact 26.2 ClientboundResourcePackPopPacket.java stores
          Optional<UUID>; ClientboundResourcePackPushPacket.java stores
          Optional<Component>, and both STREAM_CODECs use optional codecs.
      mcprotocollib: *mcprotocollib_unavailable
      minestom:
        status: confirmed
        evidence: >-
          exact tag 2026.07.22-26.2 common ResourcePackPop/Push packet records
          use @Nullable values with optional NetworkBuffer types.

  - name: cookie-response-payloads
    ids:
      - "com/hiczp/minecraft/protocol/model/packet/ConfigurationPackets.kt#ConfigurationCookieResponsePacket.payload"
      - "com/hiczp/minecraft/protocol/model/packet/LoginPackets.kt#LoginCookieResponsePacket.payload"
      - "com/hiczp/minecraft/protocol/model/packet/PlayServerboundContainerAndInteractionPackets.kt#PlayCookieResponsePacket.payload"
    kotlin: nullable
    verdict: confirmed
    sources:
      wiki:
        status: confirmed
        evidence: >-
          packets.wikitext Cookie Response defines the payload as a Prefixed
          Optional byte array; the common response layout is registered in
          login, configuration, and play.
      official:
        status: confirmed
        evidence: >-
          exact 26.2 ServerboundCookieResponsePacket.java declares a
          @Nullable byte[] payload and uses readNullable/writeNullable in its
          shared STREAM_CODEC.
      mcprotocollib: *mcprotocollib_unavailable
      minestom:
        status: confirmed
        evidence: >-
          exact tag 2026.07.22-26.2 CookieResponsePacket models its byte array
          as @Nullable and binds it to an optional NetworkBuffer type.

  - name: custom-click-action-payloads
    ids:
      - "com/hiczp/minecraft/protocol/model/packet/ConfigurationPackets.kt#ConfigurationCustomClickActionPacket.payload"
      - "com/hiczp/minecraft/protocol/model/packet/PlayServerboundInteractionPackets.kt#PlayCustomClickActionPacket.payload"
    kotlin: nullable
    verdict: confirmed
    sources:
      wiki:
        status: confirmed
        evidence: >-
          packets.wikitext Custom Click Action declares the length-prefixed NBT
          payload optional for the shared configuration/play packet.
      official:
        status: confirmed
        evidence: >-
          exact 26.2 ServerboundCustomClickActionPacket.java stores
          Optional<Tag>; UNTRUSTED_TAG_CODEC is an optional NBT codec inside
          the 65536-byte length prefix.
      mcprotocollib: *mcprotocollib_unavailable
      minestom:
        status: ambiguous
        evidence: >-
          exact tag 2026.07.22-26.2 ClientCustomClickActionPacket exposes a
          non-null BinaryTag but its listener maps the END-tag absence sentinel
          to @Nullable event payloads. Official Optional<Tag> resolves the API
          representation.

  - name: login-plugin-response-data
    ids:
      - "com/hiczp/minecraft/protocol/model/packet/LoginPackets.kt#LoginPluginResponsePacket.data"
    kotlin: nullable
    verdict: confirmed
    sources:
      wiki:
        status: confirmed
        evidence: >-
          packets.wikitext Login Plugin Response at lines 764-765 says the
          remaining response bytes exist only when Successful is true.
      official:
        status: confirmed
        evidence: >-
          exact 26.2 ServerboundCustomQueryAnswerPacket.java models the
          response payload as @Nullable and conditionally reads/writes it.
      mcprotocollib: *mcprotocollib_unavailable
      minestom:
        status: confirmed
        evidence: >-
          exact tag 2026.07.22-26.2 LoginPlugin.Response uses a
          byte @Nullable [] payload and the login packet serializer encodes its
          Boolean presence.

  - name: damage-event-sources
    ids:
      - "com/hiczp/minecraft/protocol/model/packet/PlayClientboundDamageAndDebugPackets.kt#DamageEventPacket.sourceCauseEntityId"
      - "com/hiczp/minecraft/protocol/model/packet/PlayClientboundDamageAndDebugPackets.kt#DamageEventPacket.sourceDirectEntityId"
      - "com/hiczp/minecraft/protocol/model/packet/PlayClientboundDamageAndDebugPackets.kt#DamageEventPacket.sourcePosition"
    kotlin: nullable
    verdict: confirmed
    sources:
      wiki:
        status: confirmed
        evidence: >-
          packets.wikitext Damage Event at lines 2881-2893 defines source IDs
          as ID+1 with zero absent and the source position as Boolean-prefixed
          optional.
      official:
        status: confirmed
        evidence: >-
          exact 26.2 ClientboundDamageEventPacket.java converts nullable entity
          sources to zero/ID+1 and uses Optional<Vec3> for sourcePosition in
          its STREAM_CODEC.
      mcprotocollib: *mcprotocollib_unavailable
      minestom:
        status: confirmed
        evidence: >-
          exact tag 2026.07.22-26.2 DamageEventPacket documents zero source
          sentinels and uses optional VECTOR3D for the source position.

  - name: explosion-knockback
    ids:
      - "com/hiczp/minecraft/protocol/model/packet/PlayClientboundDisplayPackets.kt#ExplosionPacket.playerKnockback"
    kotlin: nullable
    verdict: confirmed

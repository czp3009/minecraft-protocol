      official:
        status: confirmed
        evidence: >-
          exact 26.2 ClientboundExplodePacket.java stores Optional<Vec3>
          knockback and applies ByteBufCodecs::optional in STREAM_CODEC.
      mcprotocollib: *mcprotocollib_unavailable
      minestom:
        status: confirmed
        evidence: >-
          exact tag 2026.07.22-26.2 ExplosionPacket declares
          @Nullable Point playerKnockback and VECTOR3D.optional().

